[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--shamefully-hoist"

# Explicitly enable the maintained adapter: this site was originally imported as static.
# It packages Server Actions, server routes and middleware instead of publishing .next as files.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# CDN-served public files do not inherit Next's response headers.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
    X-Content-Type-Options = "nosniff"

# Supabase values live in Netlify's production environment, never in this file.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
